<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32 ロガー ライブ</title>
<style>
:root{--bg:#f3f5f2;--card:#fff;--tx:#16201a;--mu:#6b7a70;--ln:#dfe5e0;--ac:#1f7a4d}
@media(prefers-color-scheme:dark){:root{--bg:#0e1411;--card:#17201a;--tx:#e6efe9;--mu:#8a9a90;--ln:#27332b;--ac:#3ddc84}}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
h1{font-size:17px;margin:0;font-weight:600}
button{padding:9px 18px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-size:14px;font-weight:600}
@media(prefers-color-scheme:dark){button{color:#08140d}}
button:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
.info{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px 12px}
.hd{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--mu)}
.v{font-size:26px;font-weight:600;color:var(--tx);font-variant-numeric:tabular-nums}
canvas{width:100%;height:96px;display:block;margin-top:6px}
.range{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.range button{padding:6px 12px;font-size:13px;font-weight:500;background:var(--card);color:var(--tx);border:1px solid var(--ln)}
.range button.on{background:var(--ac);color:#fff;border-color:transparent}
@media(prefers-color-scheme:dark){.range button.on{color:#08140d}}
.act{display:flex;gap:8px}
.sec{background:var(--card);color:var(--tx);border:1px solid var(--ln)}
.sub{font-size:13px;color:var(--mu);margin-top:8px;line-height:1.5}
#tr-v{font-size:20px}
</style>
</head>
<body>
<header><h1>ESP32 ロガー</h1><div class="act"><button id="csv" class="sec">CSV保存 (0)</button><button id="btn">接続</button></div></header>
<div class="range" id="range"></div>
<div class="info"><span><span id="st">未接続</span><span id="wk"></span></span><span id="gps">衛星 -- / HDOP --</span></div>
<div class="grid" id="grid"></div>

<script>
const SVC='6e400001-b5a3-f393-e0a9-e50e24dcca9e', TX='6e400003-b5a3-f393-e0a9-e50e24dcca9e';
let RANGE=300;               // 表示する時間幅（秒）
const KEEP=3*3600*1000;      // 保持する時間（3時間）
const defs=[
  {k:'temp',n:'気温',u:'°C',c:'#f97316',d:1},
  {k:'hum', n:'湿度',u:'%',c:'#06b6d4',d:0},
  {k:'pres',n:'気圧',u:'hPa',c:'#a855f7',d:1},
  {k:'tvoc',n:'TVOC',u:'ppb',c:'#10b981',d:0},
  {k:'alt', n:'標高',u:'m',c:'#3b82f6',d:1},
  {k:'spd', n:'速度',u:'km/h',c:'#eab308',d:1}
];
const data={}, $=id=>document.getElementById(id), btn=$('btn');
defs.forEach(d=>{
  data[d.k]=[];
  const el=document.createElement('div'); el.className='card';
  el.innerHTML=`<div class="hd"><span>${d.n}</span><span class="v" id="v-${d.k}">--</span></div><canvas id="c-${d.k}"></canvas>`;
  $('grid').appendChild(el);
});
const trc=document.createElement('div'); trc.className='card';
trc.innerHTML='<div class="hd"><span>気圧トレンド（3時間）</span><span class="v" id="tr-v">--</span></div><div class="sub" id="tr-s">計測中…（30分たまると表示）</div>';
$('grid').appendChild(trc);

function fmt(t){
  const d=new Date(t), p=n=>String(n).padStart(2,'0');
  return p(d.getHours())+':'+p(d.getMinutes())+(RANGE<=300?':'+p(d.getSeconds()):'');
}
function draw(d){
  const cv=$('c-'+d.k), r=devicePixelRatio||1, w=cv.clientWidth, H=cv.clientHeight, h=H-14;
  cv.width=w*r; cv.height=H*r;
  const x=cv.getContext('2d'); x.scale(r,r);
  const end=Date.now(), start=end-RANGE*1000;
  const a=data[d.k].filter(p=>p[0]>=start);
  x.fillStyle='#8a9a90'; x.font='10px sans-serif';
  x.fillText(fmt(start),3,H-3);
  const m=fmt(start+RANGE*500); x.fillText(m,w/2-x.measureText(m).width/2,H-3);
  const e=fmt(end); x.fillText(e,w-x.measureText(e).width-3,H-3);
  x.strokeStyle='rgba(128,128,128,.25)'; x.lineWidth=1;
  for(let i=0;i<=2;i++){const y=Math.round(i*(h-1)/2)+.5; x.beginPath(); x.moveTo(0,y); x.lineTo(w,y); x.stroke();}
  if(a.length<2) return;
  let mn=Infinity, mx=-Infinity;
  for(const p of a){ if(p[1]<mn) mn=p[1]; if(p[1]>mx) mx=p[1]; }
  if(mx-mn<0.5){const c=(mx+mn)/2; mn=c-.25; mx=c+.25;}
  const pad=(mx-mn)*.12; mn-=pad; mx+=pad;
  x.fillText(mx.toFixed(d.d),3,11); x.fillText(mn.toFixed(d.d),3,h-3);
  x.strokeStyle=d.c; x.lineWidth=2; x.lineJoin='round'; x.beginPath();
  const step=Math.max(1,Math.floor(a.length/(w*1.5)));
  for(let i=0;i<a.length;i+=step){
    const px=(a[i][0]-start)/(RANGE*1000)*w, py=h-(a[i][1]-mn)/(mx-mn)*h;
    i?x.lineTo(px,py):x.moveTo(px,py);
  }
  x.stroke();
}

// 受信: "temp,hum,pres,tvoc,alt,spd,sat,hdop\n"（BLEの分割パケットを改行でつなぐ）
// 気圧トレンド: 3時間あたりの変化量で判定（30分以上のデータが必要）
function trend(){
  const a=data.pres, v=$('tr-v'), t=$('tr-s');
  if(a.length<2) return;
  const span=a[a.length-1][0]-a[0][0];
  if(span<30*60000){
    v.textContent='--';
    t.textContent='計測中… あと約'+Math.ceil((30*60000-span)/60000)+'分で表示';
    return;
  }
  const k=Math.min(30,Math.max(1,Math.floor(a.length/4)));
  const avg=arr=>arr.reduce((sum,p)=>sum+p[1],0)/arr.length;
  const d=avg(a.slice(-k))-avg(a.slice(0,k));
  const r=d/span*10800000;
  let label,adv;
  if(r<=-3.5){label='急下降';adv='天気が急に崩れる可能性';}
  else if(r<=-1){label='下降';adv='天気が崩れやすい傾向';}
  else if(r<1){label='安定';adv='大きな変化なし';}
  else if(r<3.5){label='上昇';adv='天気は回復傾向';}
  else{label='急上昇';adv='急な天気の変化に注意';}
  v.textContent=(r>=0?'+':'')+r.toFixed(1)+' hPa/3h';
  t.textContent=label+'：'+adv+'（'+Math.round(span/60000)+'分間で '+(d>=0?'+':'')+d.toFixed(1)+' hPa）。移動して標高が変わると、この値も変わります。';
}

// CSV用の記録（受信した時刻は、スマホの時計）
const rows=[];
const ts=d=>{const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());};

let buf='';
function onData(ev){
  buf+=new TextDecoder().decode(ev.target.value);
  let i;
  while((i=buf.indexOf('\n'))>=0){
    const line=buf.slice(0,i).trim(); buf=buf.slice(i+1);
    if(line) parse(line);
  }
}
function parse(line){
  const f=line.split(',').map(parseFloat);
  const now=Date.now();
  defs.forEach((d,i)=>{
    const v=f[i];
    if(!isFinite(v)) return;
    const a=data[d.k]; a.push([now,v]); while(a.length&&a[0][0]<now-KEEP) a.shift();
    $('v-'+d.k).textContent=v.toFixed(d.d)+' '+d.u;
  });
  $('gps').textContent=`衛星 ${f[6]} / HDOP ${f[7]}`;
  rows.push(ts(new Date(now))+','+f.slice(0,8).map(v=>isFinite(v)?v:'').join(','));
  if(rows.length>200000) rows.splice(0,10000);
  $('csv').textContent='CSV保存 ('+rows.length+')';
  trend();
  defs.forEach(draw);
}

[[60,'1分'],[300,'5分'],[1800,'30分'],[3600,'1時間'],[10800,'3時間']].forEach(([sec,label])=>{
  const b=document.createElement('button'); b.textContent=label; if(sec===RANGE) b.className='on';
  b.onclick=()=>{
    RANGE=sec;
    document.querySelectorAll('#range button').forEach(x=>x.className='');
    b.className='on'; defs.forEach(draw);
  };
  $('range').appendChild(b);
});

let dev, userDisc=false, reconnecting=false, wl=null;
const st=t=>$('st').textContent=t;

// 画面スリープ防止（スマホが寝るとBluetoothが切れやすいため）
async function takeWake(){
  try{
    if('wakeLock' in navigator){
      wl=await navigator.wakeLock.request('screen');
      wl.addEventListener('release',()=>{wl=null; $('wk').textContent='';});
      $('wk').textContent=' ・画面ON維持';
    }
  }catch(e){}
}
function releaseWake(){ if(wl){ wl.release().catch(()=>{}); wl=null; } $('wk').textContent=''; }
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && dev && dev.gatt.connected && !wl) takeWake();
});

async function openLink(){
  const srv=await dev.gatt.connect();
  const ch=await (await srv.getPrimaryService(SVC)).getCharacteristic(TX);
  await ch.startNotifications();
  ch.addEventListener('characteristicvaluechanged',onData);
  buf='';
  btn.textContent='切断'; st('接続中: '+(dev.name||'ESP32'));
  await takeWake();
}

// 切断されたら、3秒おきに最大30回（約1.5分）再接続を試す
async function autoReconnect(){
  if(reconnecting) return;
  reconnecting=true; btn.textContent='停止';
  for(let i=1; i<=30 && !userDisc; i++){
    st('切断されました。再接続中… ('+i+'/30)');
    await new Promise(r=>setTimeout(r,3000));
    if(userDisc) break;
    try{ await openLink(); reconnecting=false; return; }catch(e){}
  }
  reconnecting=false; btn.textContent='接続';
  st(userDisc ? '停止しました' : '再接続できませんでした。「接続」を押してください');
}
function onDisc(){
  releaseWake();
  if(userDisc){ st('切断しました'); btn.textContent='接続'; return; }
  autoReconnect();
}

async function connect(){
  try{
    userDisc=false;
    dev=await navigator.bluetooth.requestDevice({filters:[{services:[SVC]}]});
    if(!dev._l){ dev._l=1; dev.addEventListener('gattserverdisconnected',onDisc); }
    st('接続中…');
    await openLink();
  }catch(e){ st('接続できません: '+e.message); }
}
btn.onclick=()=>{
  if(dev && dev.gatt.connected){ userDisc=true; dev.gatt.disconnect(); }
  else if(reconnecting){ userDisc=true; }
  else connect();
};

// CSV保存
$('csv').onclick=()=>{
  const b=$('csv');
  if(!rows.length){ b.textContent='データなし'; setTimeout(()=>b.textContent='CSV保存 (0)',1500); return; }
  const blob=new Blob(['time,temp,hum,pres,tvoc,alt,spd,sat,hdop\n'+rows.join('\n')+'\n'],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='logger_'+ts(new Date()).replace(/[-: ]/g,'').replace(/^(\d{8})(\d{6})$/,'$1_$2')+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),10000);
};
addEventListener('resize',()=>defs.forEach(draw));
if(!navigator.bluetooth) st('このブラウザは非対応です（Android: Chrome / iPhone: Bluefy）');
</script>
</body>
</html>
